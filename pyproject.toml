[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachme"
version = "0.1.0"
description = "Agentic pipeline that turns any topic into a 3Blue1Brown-style narrated explainer video, with pluggable agents, renderers, and voices."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "manim>=0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
web = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "edge-tts>=7.2",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "python-multipart>=0.0.9",
]

[project.scripts]
teachme = "teachme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teachme"]
